<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!--
      PRZEKIEROWANIE ZE STAREGO ADRESU.

      GitHub Pages nie potrafi odpowiedziec kodem 301 - nie ma tam warstwy
      serwerowej ani pliku przepisujacego adresy. Jedyne, co dziala na czysto
      statycznym hostingu, to odswiezenie znacznikiem meta plus canonical
      wskazujacy nowy adres.

      Konsekwencje i droga do prawdziwego 301 (wlasna domena za Cloudflare):
      docs/ADR/0008-hub-oferty-i-przekierowania.md.

      `noindex` jest tu konieczny: bez niego wyszukiwarka trzymalaby w indeksie
      dwa adresy o tej samej tresci.
    -->
    <meta http-equiv="refresh" content="0; url=/oferta/seniorzy/" />
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="https://radek1983.github.io/oferta/seniorzy/" />

    <title>Angielski dla seniorów - strona zmieniła adres | High Five</title>

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/css/main.css" />
  </head>

  <body>
    <main id="main" class="section">
      <div class="container page-hero__text page-hero__text--wide">
        <h1 class="u-h2">Ta strona ma nowy adres</h1>
        <p class="u-lead">
          Oferta dla seniorów przeniosła się do sekcji oferty. Za chwilę przeniesiemy Cię
          automatycznie.
        </p>
        <a class="cta" href="/oferta/seniorzy/">
          Przejdź do zajęć dla seniorów
          <span class="cta__arrow" aria-hidden="true">→</span>
        </a>
      </div>
    </main>
  </body>
</html>
