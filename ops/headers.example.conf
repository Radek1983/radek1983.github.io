# ---------------------------------------------------------------------------
# HIGH FIVE - docelowa polityka naglowkow bezpieczenstwa i cache
#
# STATUS: NIE JEST WYKONYWANA. GitHub Pages nie pozwala ustawiac naglowkow HTTP.
# Uzasadnienie: docs/ADR/0003-naglowki-bezpieczenstwa-na-github-pages.md
# Macierz zgodnosci: docs/HOSTING.md
#
# Ponizsze warianty sa gotowe do uzycia, gdy strona trafi na hosting
# z konfigurowalnymi naglowkami albo za Cloudflare.
# ---------------------------------------------------------------------------


# ===========================================================================
# 1. nginx
# ===========================================================================

add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# HSTS wlaczac dopiero po stabilnym HTTPS. preload wymaga osobnej decyzji -
# obejmuje wszystkie subdomeny i jest trudno odwracalny.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Cache: HTML krotko, hashowane assety na dlugo i jako immutable.
location = /index.html   { add_header Cache-Control "no-cache" always; }
location = /404.html     { add_header Cache-Control "no-cache" always; }
location = /version.json { add_header Cache-Control "no-cache" always; }
location = /robots.txt   { add_header Cache-Control "public, max-age=3600" always; }
location = /sitemap.xml  { add_header Cache-Control "public, max-age=3600" always; }
location /assets/        { add_header Cache-Control "public, max-age=31536000, immutable" always; }


# ===========================================================================
# 2. Cloudflare Pages / Netlify - plik _headers w katalogu publicznym
# ===========================================================================
#
# /*
#   Content-Security-Policy: default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests
#   X-Content-Type-Options: nosniff
#   Referrer-Policy: strict-origin-when-cross-origin
#   Permissions-Policy: camera=(), microphone=(), geolocation=()
#   Strict-Transport-Security: max-age=31536000; includeSubDomains
#
# /assets/*
#   Cache-Control: public, max-age=31536000, immutable
#
# /index.html
#   Cache-Control: no-cache
#
# /version.json
#   Cache-Control: no-cache


# ===========================================================================
# 3. Cloudflare przed GitHub Pages - Response Header Transform Rule
# ===========================================================================
#
# Pages pozostaje hostem. Konfiguracja w panelu Cloudflare:
#   Rules -> Transform Rules -> Modify Response Header -> Create rule
#
# Wyrazenie:  true   (albo http.host eq "<domena>")
# Operacje:   Set static, po jednej dla kazdego naglowka z sekcji 1.
#
# Cache per sciezka:  Rules -> Cache Rules
#   - dopasowanie  starts_with(http.request.uri.path, "/assets/")
#     -> Browser TTL 1 rok
#   - dopasowanie  http.request.uri.path in {"/" "/index.html" "/version.json"}
#     -> Browser TTL: respect origin / no-cache
#
# Cloudflare odrzuca naglowki cf-*, x-cf-*, server oraz eh-cache-*.
# Zaden z powyzszych do nich nie nalezy.


# ===========================================================================
# 4. Czego NIE da sie zrobic samym HTML
# ===========================================================================
#
# W <meta http-equiv="Content-Security-Policy"> dzialaja:
#   default-src, script-src, style-src, img-src, font-src, connect-src,
#   base-uri, form-action, object-src, upgrade-insecure-requests
#
# Sa IGNOROWANE (specyfikacja W3C CSP, sekcja o dostarczaniu przez meta):
#   frame-ancestors, report-uri, report-to, sandbox
#
# Nie maja odpowiednika w meta w ogole:
#   X-Content-Type-Options, Permissions-Policy, Strict-Transport-Security
#
# <meta http-equiv="Cache-Control"> nie jest respektowany przez cache HTTP
# przegladarek. Nie dodawac - to nieporozumienie, nie obejscie.
