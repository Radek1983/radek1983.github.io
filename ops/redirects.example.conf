# ===========================================================================
# 1. Canonical host - jedna wersja domeny, druga przekierowuje
# ===========================================================================
#
# Decyzja apex vs www nalezy do wlasciciela i musi byc zgodna z:
#   - <link rel="canonical"> w index.html
#   - public/sitemap.xml
#   - public/robots.txt
#   - VITE_SITE_URL w workflow wdrozeniowym
#
# Wariant A - apex kanoniczny (przyklad dla nginx):
#
#   server {
#     server_name www.example.pl;
#     return 308 https://example.pl$request_uri;
#   }
#
# Wariant B - www kanoniczny:
#
#   server {
#     server_name example.pl;
#     return 308 https://www.example.pl$request_uri;
#   }
#
# 308 zachowuje metode HTTP. 301 tez jest akceptowalny dla GET.


# ===========================================================================
# 2. HTTP -> HTTPS
# ===========================================================================
#
# Na GitHub Pages realizowane przez opcje "Enforce HTTPS" w Settings -> Pages.
# Na wlasnym serwerze:
#
#   server {
#     listen 80;
#     server_name example.pl www.example.pl;
#     return 308 https://$host$request_uri;
#   }


# ===========================================================================
# 3. Migracja z radek1983.github.io na wlasna domene
# ===========================================================================
#
# GitHub Pages po ustawieniu custom domain sam przekierowuje adres
# <uzytkownik>.github.io na nowa domene. Nie trzeba tego konfigurowac recznie.
#
# Do wykonania przy migracji:
#   1. Obnizyc TTL rekordow DNS z wyprzedzeniem.
#   2. Ustawic custom domain w Settings -> Pages (tworzy plik CNAME).
#   3. Podmienic adres kanoniczny w index.html, sitemap.xml, robots.txt
#      i VITE_SITE_URL - to jedna zmiana w jednym miejscu (decyzja D3).
#   4. Poczekac na certyfikat, potem wlaczyc "Enforce HTTPS".
#   5. Zglosic zmiane adresu w Google Search Console.
#   6. HSTS dopiero po stabilnym HTTPS.


# ===========================================================================
# 4. Przekierowania wewnetrzne
# ===========================================================================
#
# Model onepage - brak podstron, wiec brak przekierowan wewnetrznych.
# Sekcje sa kotwicami (#oferta, #cennik, #faq, #kontakt), nie osobnymi adresami,
# i nie podlegaja przekierowaniom.
#
# Gdyby powstaly podstrony SEO opisane w docs/SEO.md, mapowanie starych
# adresow na nowe dopisac tutaj.
