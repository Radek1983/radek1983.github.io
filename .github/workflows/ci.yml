name: CI

on:
  pull_request:
  push:
    branches: [main]

# Minimalne uprawnienia - workflow tylko czyta kod (spec 13.2).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint / validate / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # npm ci, nigdy npm install w CI (spec 13.2).
      - run: npm ci

      - run: npm run format:check
      - run: npm run lint:js
      - run: npm run lint:css

      # Kolejnosc jest ISTOTNA: html-validate sprawdza dist/, a nie zrodla.
      # Dokument w repozytorium nie jest jeszcze kompletnym HTML-em - naglowek,
      # stopka i dane kontaktowe wchodza do niego dopiero przy budowaniu
      # (plugin high-five-html-partials w vite.config.js). Walidacja przed
      # buildem nie ma czego czytac.
      #
      # Ta sama kolejnosc co w skrypcie `check`, ktory uruchamiamy lokalnie
      # przed PR - inaczej CI i maszyna dewelopera sprawdzaja co innego.
      - run: npm run build
      - run: npm run validate:html

  test:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - run: npm run test:e2e

      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
