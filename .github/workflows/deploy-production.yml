name: Deploy production

on:
  # Wdrozenie po scaleniu do main. Wymagane checks pilnuje ruleset na main,
  # a job build powtarza kontrole na wszelki wypadek.
  push:
    branches: [main]

  # Reczne wdrozenie dowolnego commita lub taga.
  # To jest procedura ROLLBACK: podaj poprzedni dobry tag, np. v1.0.0.
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag, branch lub commit SHA do wdrozenia (rollback: poprzedni dobry tag)'
        required: false
        default: main
        type: string

permissions:
  contents: read

# Wdrozenia produkcyjne nie anuluja sie wzajemnie - kolejkuja sie.
concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ${{ inputs.ref || github.ref_name }}
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          # Pelna historia - scripts/write-version.mjs korzysta z git describe.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build
        run: npm run build
        env:
          # Dla user site base_path jest pusty, wiec wychodzi "/".
          # Zapis przez output zamiast na sztywno - przetrwa zmiane nazwy repozytorium.
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/
          VITE_ENV_NAME: production
          VITE_SITE_URL: https://radek1983.github.io

      # Kontrole jakosci na dokladnie tym artefakcie, ktory zostanie opublikowany.
      - run: npm run lint:js
      - run: npm run lint:css
      - run: npm run validate:html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest

    # Minimum wymagane przez actions/deploy-pages.
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  smoke:
    name: smoke test produkcji
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      # Release jest zakonczony dopiero po sprawdzeniu publicznego URL (spec 22.3).
      - name: Sprawdz status 200, HTTPS i wersje
        run: |
          set -euo pipefail
          URL="https://radek1983.github.io"

          echo "--- strona glowna ---"
          code=$(curl -sS -o /tmp/index.html -w '%{http_code}' --retry 5 --retry-delay 10 --retry-all-errors "$URL/")
          echo "HTTP $code"
          test "$code" = "200"

          echo "--- czy tresc krytyczna jest w HTML ---"
          grep -q "Angielski po lekcjach" /tmp/index.html
          grep -q "SP 402" /tmp/index.html || grep -q "402" /tmp/index.html

          echo "--- czy to build, a nie surowe zrodla ---"
          if grep -q '/src/js/main.js' /tmp/index.html; then
            echo "BLAD: opublikowano surowe zrodla zamiast builda z Vite" >&2
            exit 1
          fi

          echo "--- version.json ---"
          curl -sS --retry 5 --retry-delay 10 --retry-all-errors "$URL/version.json"

          echo "--- 404 ---"
          curl -sS -o /dev/null -w 'HTTP %{http_code}\n' "$URL/404.html"
